# ============================================================================
# 🥗 Nutri Governance Remediation Patch for dbt & DataHub
# Target Asset: suppliers (Snowflake / dbt)
# Generated by: Nutri Analytics Agent & PRD Governance Engine
# Action: Document missing columns & add owner to elevate Completeness from 55% to 100%
# ============================================================================

version: 2

models:
  - name: suppliers
    description: "Master dataset containing vendor and supplier profiles, payment terms, and contact information."
    meta:
      owner: "data_governance_team@company.com"
      nutri_target_score: 90
    columns:
      - name: supplier_id
        description: "Primary key identifier for the supplier entity."
        tests:
          - unique
          - not_null

      - name: supplier_name
        description: "Legal registered trading name of the supplier."
        tests:
          - not_null

      - name: contact_email
        description: "Primary email address for procurement and invoicing."
        meta:
          contains_pii: true

      - name: tax_identifier
        description: "Federal tax identification number or VAT ID."
        meta:
          contains_pii: true
          security_classification: "restricted"

      - name: payment_terms_days
        description: "Standard net payment terms window in days (e.g. 30, 60, 90)."
        tests:
          - accepted_values:
              values: [15, 30, 45, 60, 90]
